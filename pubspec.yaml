name: idara_khair_ul_ibad
description: ادارہ خیر العباد - Complete Islamic digital application.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # UI / fonts
  google_fonts: ^6.2.1
  scrollable_positioned_list: ^0.3.8

  # Storage & networking
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  http: ^1.2.2

  # Islamic features
  adhan: ^2.0.0+1
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  share_plus: ^10.1.4
  audioplayers: ^6.5.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/audio/adhan.ogg
